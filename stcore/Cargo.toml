[package]
name = "stcore"
version = "0.1.0"
edition = "2021"

[dependencies]
tantivy = { workspace = true }
jieba-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 提取层（任务 #27）
chardetng = "0.1"
encoding_rs = "0.8"
zip = { version = "4", default-features = false, features = ["deflate", "bzip2"] }
flate2 = "1"
tar = "0.4"
scraper = "0.24"
mail-parser = "0.10"
ignore = "0.4"
walkdir = "2"
# 索引层（任务 #26）
rusqlite = { version = "0.37", features = ["bundled"] }
memmap2 = "0.9"
rayon = "1"
notify = "8"
nom = "8"
anyhow = "1"

# --- P0+ 子项 3/4：目录规则 globset + 预览匹配 aho-corasick + 文档内正则 ---
globset = "0.4"
aho-corasick = "1"
regex = "1"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
ebook-rs = "0.17.1"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
pinyin = "0.11.0"
png = "0.18.1"
anydoc = "0.2.4"
sevenz-rust2 = "0.24.0"
unrar = "0.5.8"
bzip2 = "0.6.1"
chmlib = "1.0.0"

[dev-dependencies]
tempfile = "3"
