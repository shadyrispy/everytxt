name: CI

# 不在 push/PR 上触发：仅在 release 发布时自动运行，
# 或经 Actions 页面手动触发（workflow_dispatch）。
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux-x86:
    name: linux-x86 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统依赖（Tauri Linux 运行时 + C/C++ 工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 获取第三方二进制（pdfium + OCR 模型，不入库）
        run: bash scripts/fetch-binaries.sh --platform linux
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  linux-arm:
    name: linux-arm (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: 系统依赖（Tauri Linux 运行时 + C/C++ 工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 获取第三方二进制（pdfium + OCR 模型，不入库）
        run: bash scripts/fetch-binaries.sh --platform linux
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  windows:
    name: windows (windows-latest, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 获取第三方二进制（pdfium.dll + OCR 模型，不入库）
        shell: bash
        run: bash scripts/fetch-binaries.sh --platform windows
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
